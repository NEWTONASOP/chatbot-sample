<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel AI Assistant</title>
  <meta name="description" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>

  <!-- ====== CHATBOT WIDGET ====== -->
  <div id="chatbot-wrapper">
    <!-- Chat Window -->
    <div class="chatbot-window" id="chatbotWindow">
      <div class="chatbot-header">
        <div class="chatbot-header-info">
          <div class="chatbot-header-avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="10" rx="2" />
              <circle cx="12" cy="5" r="3" />
            </svg>
            <span class="chatbot-header-status"></span>
          </div>
          <div>
            <h3>Travel AI</h3>
            <p><span class="status-dot-sm"></span> Online • Replies instantly</p>
          </div>
        </div>
        <div class="chatbot-header-actions">
          <button class="chatbot-action-btn" onclick="closeChatbot()" title="Close chat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
      </div>

      <div class="chatbot-messages" id="chatbotMessages">
        <!-- Messages will be injected here -->
      </div>

      <div class="chatbot-input-area">
        <form id="chatbotForm" onsubmit="handleChatSubmit(event)">
          <div class="chatbot-input-wrapper">
            <input type="text" id="chatbotInput" placeholder="Plan your dream trip..." autocomplete="off" />
            <button type="submit" class="chatbot-send-btn" id="chatbotSendBtn" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </button>
          </div>
        </form>
        <div class="chatbot-powered">Powered by <strong>Deteroid</strong></div>
      </div>
    </div>
  </div>

  <script>
    (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; typeof namespace === "string" ? (cal.ns[namespace] = cal.ns[namespace] || api) : p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
    Cal("init", "chatbot-meeting", { origin: "https://cal.com" });
    Cal.ns["chatbot-meeting"]("ui", { "hideEventTypeDetails": true, "layout": "month_view" });
  </script>
  <script type="module" src="/src/chatbot.js"></script>
</body>

</html>
